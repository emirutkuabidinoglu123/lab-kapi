<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b2a5b">
  <title>Lab Kapısı</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Lab Kapısı">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <script src="https://unpkg.com/mqtt@5/dist/mqtt.min.js"></script>
  <style>
    :root {
      --lacivert: #0b2a5b;
      --lacivert-acik: #1d4e9e;
      --zemin: #f3f6fb;
      --yazi: #0f1e36;
      --soluk: #5b6b85;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, "Segoe UI", sans-serif;
      background: var(--zemin);
      color: var(--yazi);
    }

    /* ---------- Ust bant: devre deseni + sinyal dalgalari ---------- */
    header {
      position: relative;
      background: var(--lacivert);
      color: white;
      padding: 40px 24px 100px;
      text-align: center;
      overflow: hidden;
    }
    header svg.desen { position: absolute; inset: 0; width: 100%; height: 100%; }
    header .icerik { position: relative; }
    .fakulte { font-size: 12px; letter-spacing: 2px; text-transform: uppercase; opacity: .75; margin: 0; }
    h1 { margin: 10px 0 4px; font-size: 30px; }
    .bolum { margin: 0; font-size: 14px; opacity: .85; }

    /* ---------- Ana kart ---------- */
    main {
      max-width: 380px;
      margin: -60px auto 0;
      padding: 0 16px 32px;
      position: relative;
    }
    .kart {
      background: white;
      border-radius: 24px;
      padding: 32px 24px 26px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(11, 42, 91, .12);
    }
    #buton {
      width: 170px; height: 170px;
      border-radius: 50%;
      border: 8px solid #e3eaf6;
      background: var(--lacivert);
      color: white;
      font-size: 18px; font-weight: 700;
      cursor: pointer;
      display: inline-flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
      transition: transform .1s, background .2s;
    }
    #buton:active { transform: scale(.96); }
    #buton:disabled { background: #9aa8bf; cursor: not-allowed; }
    #buton.acik { background: #15803d; border-color: #dcfce7; }
    #buton svg { width: 46px; height: 46px; }

    .durum {
      margin: 22px auto 0;
      display: inline-flex; align-items: center; gap: 8px;
      padding: 8px 16px;
      border-radius: 999px;
      background: var(--zemin);
      font-size: 14px; font-weight: 600;
    }
    .nokta { width: 10px; height: 10px; border-radius: 50%; background: #f59e0b; }



    /* ---------- Yeni parcalar: ayarlar, kayit ---------- */
    main { max-width: 400px; }
    .kart + .kart { margin-top: 16px; }
    .ustSatir { display: flex; justify-content: space-between; align-items: center; margin: -8px 0 18px; }
    .merhaba { font-size: 15px; font-weight: 600; }
    .ikonButon { border: 0; background: var(--zemin); width: 40px; height: 40px; border-radius: 12px; cursor: pointer; color: var(--lacivert); display: inline-flex; align-items: center; justify-content: center; }
    .ikonButon svg { width: 22px; height: 22px; }
    .alan { text-align: left; margin-bottom: 12px; }
    .alan label { display: block; font-size: 13px; color: var(--soluk); margin-bottom: 6px; }
    .alan input { width: 100%; padding: 12px; font-size: 16px; border: 2px solid #e3eaf6; border-radius: 12px; background: var(--zemin); color: var(--yazi); outline: none; }
    .alan input:focus { border-color: var(--lacivert-acik); }
    .anaButon { width: 100%; padding: 14px; font-size: 17px; font-weight: 700; border: 0; border-radius: 14px; background: var(--lacivert); color: white; cursor: pointer; }
    .anaButon:active { transform: scale(.98); }
    .ikinciButon { width: 100%; padding: 12px; font-size: 15px; font-weight: 600; border: 2px solid #e3eaf6; border-radius: 14px; background: white; color: var(--lacivert); cursor: pointer; margin-top: 10px; }
    .uyari { margin-top: 10px; min-height: 20px; font-size: 14px; }
    .uyari.kotu { color: #b91c1c; } .uyari.iyi { color: #15803d; }
    .kartBaslik { margin: 0 0 14px; font-size: 17px; font-weight: 700; text-align: left; }
    .ayrac { border: 0; border-top: 1px solid #e3eaf6; margin: 18px 0; }
    #kayitListe { list-style: none; margin: 0; padding: 0; text-align: left; }
    #kayitListe li { display: flex; gap: 12px; padding: 10px 0; border-bottom: 1px solid #eef2f9; font-size: 14px; }
    #kayitListe li:last-child { border-bottom: 0; }
    .kZaman { color: var(--soluk); white-space: nowrap; font-variant-numeric: tabular-nums; }
    .kKim { font-weight: 600; }
    .kOlay { color: var(--soluk); }
    .kOlay.kotu { color: #b91c1c; font-weight: 600; }
    .bos { color: var(--soluk); font-size: 14px; text-align: left; }
    .kilitIkon { width: 56px; height: 56px; color: var(--lacivert); margin-bottom: 8px; }
    .gizli { display: none !important; }
    footer { text-align: center; font-size: 12px; color: var(--soluk); padding: 8px 16px 24px; }
  </style>
</head>
<body>
  <header>
    <!-- Devre izleri ve anten dalgalari: tamamen kodla cizildi -->
    <svg class="desen" viewBox="0 0 400 240" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <g fill="none" stroke="#3b6fc4" stroke-width="1.4" opacity=".6">
        <path d="M0 40 H70 L90 60 H150"/><circle cx="150" cy="60" r="3.5"/>
        <path d="M0 120 H40 L60 100 H110 L125 115"/><circle cx="125" cy="115" r="3.5"/>
        <path d="M0 190 H90 L110 170 H140"/><circle cx="140" cy="170" r="3.5"/>
        <path d="M400 30 H330 L310 50 H260"/><circle cx="260" cy="50" r="3.5"/>
        <path d="M400 110 H350 L335 125 H290"/><circle cx="290" cy="125" r="3.5"/>
        <path d="M400 200 H320 L300 180 H265"/><circle cx="265" cy="180" r="3.5"/>
        <rect x="175" y="196" width="50" height="22" rx="3"/>
        <path d="M182 196 v-8 M192 196 v-8 M202 196 v-8 M212 196 v-8 M218 196 v-8"/>
      </g>
      <g fill="none" stroke="#7aa2e3" stroke-width="2" opacity=".5" stroke-linecap="round">
        <path d="M352 62 L344 92 M352 62 L360 92 M347 80 H357"/>
        <circle cx="352" cy="58" r="3" fill="#7aa2e3"/>
        <path d="M340 46 a17 17 0 0 1 24 0"/>
        <path d="M332 38 a28 28 0 0 1 40 0"/>
        <path d="M324 30 a39 39 0 0 1 56 0"/>
      </g>
    </svg>
    <div class="icerik">
      <p class="fakulte">YTÜ · Elektrik-Elektronik Fakültesi</p>
      <h1>Lab Kapısı</h1>
      <p class="bolum">Elektronik ve Haberleşme Mühendisliği</p>
    </div>
  </header>

  <main>
    <!-- 1) GIRIS KARTI -->
    <div class="kart" id="girisKart">
      <svg class="kilitIkon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/><circle cx="12" cy="16" r="1.2"/>
      </svg>
      <p class="kartBaslik" style="text-align:center">Giriş</p>
      <div class="alan"><label for="isimGiris">Adınız</label><input id="isimGiris" placeholder="Örn. Aslıhan Hoca"></div>
      <div class="alan"><label for="pinGiris">PIN</label><input id="pinGiris" type="password" inputmode="numeric" maxlength="4" placeholder="••••"></div>
      <button class="anaButon" id="girisButon" onclick="girisYap()">Giriş Yap</button>
      <div class="uyari kotu" id="girisUyari"></div>
    </div>

    <!-- 2) KAPI KARTI -->
    <div class="kart gizli" id="kapiKart">
      <div class="ustSatir">
        <span class="merhaba" id="merhaba">Merhaba</span>
        <button class="ikonButon" onclick="ayarlariAc()" aria-label="Ayarlar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        </button>
      </div>
      <button id="buton" onclick="kapiyiAc()" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 7.5-2"/><circle cx="12" cy="16" r="1.2"/>
        </svg>
        <span id="butonYazi">Kapıyı Aç</span>
      </button>
      <div><span class="durum"><span class="nokta" id="nokta"></span><span id="yazi">Bağlanıyor...</span></span></div>
      <div class="uyari kotu" id="kapiUyari"></div>
    </div>

    <!-- 3) SON GIRISLER -->
    <div class="kart gizli" id="kayitKart">
      <p class="kartBaslik">Son girişler</p>
      <ul id="kayitListe"></ul>
      <p class="bos" id="kayitBos">Henüz kayıt yok.</p>
    </div>

    <!-- 4) AYARLAR -->
    <div class="kart gizli" id="ayarKart">
      <p class="kartBaslik">Ayarlar</p>
      <div class="alan"><label for="isimAyar">Adınız (kayıtlarda bu görünür)</label><input id="isimAyar"></div>
      <button class="ikinciButon" onclick="isimKaydet()">Adı kaydet</button>
      <hr class="ayrac">
      <p class="kartBaslik">PIN değiştir</p>
      <div class="alan"><label for="eskiPin">Mevcut PIN</label><input id="eskiPin" type="password" inputmode="numeric" maxlength="4"></div>
      <div class="alan"><label for="yeniPin">Yeni PIN (4 hane)</label><input id="yeniPin" type="password" inputmode="numeric" maxlength="4"></div>
      <div class="alan"><label for="yeniPin2">Yeni PIN tekrar</label><input id="yeniPin2" type="password" inputmode="numeric" maxlength="4"></div>
      <button class="anaButon" onclick="pinDegistir()">PIN'i değiştir</button>
      <div class="uyari" id="ayarUyari"></div>
      <hr class="ayrac">
      <button class="ikinciButon" onclick="geriDon()">← Kapıya dön</button>
      <button class="ikinciButon" onclick="cikisYap()" style="color:#b91c1c">Çıkış yap</button>
    </div>
  </main>

  <footer>Dr. Öğr. Üyesi Aslıhan Özakın Laboratuvarı</footer>

  <script>
    // ---------- Konular (ESP32 kodundakilerle AYNI olmali) ----------
    const KONU_KOMUT = "ytulab-k7q9x2/komut";
    const KONU_DURUM = "ytulab-k7q9x2/durum";
    const KONU_KAYIT = "ytulab-k7q9x2/kayit";
    const kimlik = Math.random().toString(36).slice(2, 10);         // bu telefonun gecici kimligi
    const KONU_CEVAP = "ytulab-k7q9x2/cevap/" + kimlik;              // ESP32 sadece bize buradan cevap verir

    const $ = id => document.getElementById(id);
    function sakla(a, d) { try { d === null ? localStorage.removeItem(a) : localStorage.setItem(a, d); } catch (e) {} }
    function oku(a) { try { return localStorage.getItem(a); } catch (e) { return null; } }

    let pin = oku("pin");          // dogru girildiyse bu telefonda hatirlanir
    let isim = oku("isim") || "";
    let bekleyen = null;           // cevap beklenen islem: "giris" | "ac" | "pin"
    let zamanAsimi = null;

    function goster(...idler) {
      ["girisKart", "kapiKart", "kayitKart", "ayarKart"].forEach(k => $(k).classList.toggle("gizli", !idler.includes(k)));
    }
    function durumYaz(mesaj, renk) { $("yazi").textContent = mesaj; $("nokta").style.background = renk; }
    function uyar(id, mesaj, iyi) { $(id).textContent = mesaj; $(id).className = "uyari " + (iyi ? "iyi" : "kotu"); }

    function cevapBekle(islem, uyariId) {
      bekleyen = islem;
      clearTimeout(zamanAsimi);
      zamanAsimi = setTimeout(() => { bekleyen = null; uyar(uyariId, "Kapı yanıt vermiyor, çevrimdışı olabilir."); }, 8000);
    }

    // ---------- Postaciya baglan ----------
    const postaci = mqtt.connect("wss://broker.emqx.io:8084/mqtt");

    postaci.on("connect", function () {
      postaci.subscribe([KONU_DURUM, KONU_KAYIT, KONU_CEVAP]);
      $("buton").disabled = false;
      durumYaz("Hazır", "#22c55e");
    });
    postaci.on("close", function () {
      $("buton").disabled = true;
      durumYaz("Sunucu bağlantısı yok", "#ef4444");
    });

    postaci.on("message", function (konu, veri) {
      const mesaj = veri.toString();
      if (konu === KONU_DURUM) durumGeldi(mesaj);
      else if (konu === KONU_KAYIT) kayitlariYaz(mesaj);
      else if (konu === KONU_CEVAP) cevapGeldi(mesaj);
    });

    // ---------- ESP32'den gelenler ----------
    function durumGeldi(mesaj) {
      const buton = $("buton");
      if (mesaj === "ACIK") {
        buton.classList.add("acik"); $("butonYazi").textContent = "Açıldı"; durumYaz("Kapı açık", "#15803d");
      } else if (mesaj === "KILITLI") {
        buton.classList.remove("acik"); $("butonYazi").textContent = "Kapıyı Aç"; durumYaz("Kapı kilitli", "#22c55e");
      } else if (mesaj === "CEVRIMDISI") {
        buton.classList.remove("acik"); $("butonYazi").textContent = "Kapıyı Aç"; durumYaz("Kapı çevrimdışı", "#94a3b8");
      }
    }

    function kayitlariYaz(metin) {
      const liste = $("kayitListe");
      liste.innerHTML = "";
      const satirlar = metin.split("\n").filter(s => s.trim() !== "");
      $("kayitBos").classList.toggle("gizli", satirlar.length > 0);
      satirlar.forEach(function (satir) {
        const [zaman, kim, olay] = satir.split("|");
        const li = document.createElement("li");
        const z = document.createElement("span"); z.className = "kZaman"; z.textContent = zaman;
        const k = document.createElement("span"); k.className = "kKim"; k.textContent = kim;
        const o = document.createElement("span"); o.className = "kOlay" + (olay && olay.includes("Hatalı") ? " kotu" : ""); o.textContent = olay;
        const sag = document.createElement("div"); sag.append(k, document.createElement("br"), o);
        li.append(z, sag);
        liste.append(li);
      });
    }

    function cevapGeldi(cevap) {
      const islem = bekleyen; bekleyen = null; clearTimeout(zamanAsimi);
      if (cevap === "BEKLE") {
        const id = islem === "giris" ? "girisUyari" : islem === "pin" ? "ayarUyari" : "kapiUyari";
        uyar(id, "Çok fazla hatalı deneme. 1 dakika bekleyin.");
        return;
      }
      if (islem === "giris") {
        if (cevap === "PIN_DOGRU") {
          pin = $("pinGiris").value; sakla("pin", pin); sakla("isim", isim);
          $("pinGiris").value = ""; uyar("girisUyari", "", true);
          kapiEkrani();
        } else uyar("girisUyari", "Yanlış PIN, tekrar deneyin.");
      } else if (islem === "ac") {
        if (cevap === "HATALI_PIN") {                    // PIN baska yerden degismis
          cikisYap(); uyar("girisUyari", "PIN değişmiş, lütfen tekrar giriş yapın.");
        }
      } else if (islem === "pin") {
        if (cevap === "PIN_DEGISTI") {
          pin = $("yeniPin").value; sakla("pin", pin);
          ["eskiPin", "yeniPin", "yeniPin2"].forEach(i => $(i).value = "");
          uyar("ayarUyari", "PIN değiştirildi.", true);
        } else if (cevap === "HATALI_PIN") uyar("ayarUyari", "Mevcut PIN yanlış.");
        else if (cevap === "PIN_GECERSIZ") uyar("ayarUyari", "Yeni PIN 4 haneli olmalı.");
      }
    }

    // ---------- Kullanicinin yaptiklari ----------
    function girisYap() {
      isim = $("isimGiris").value.trim();
      const girilen = $("pinGiris").value.trim();
      if (!isim) { uyar("girisUyari", "Lütfen adınızı yazın."); return; }
      if (girilen.length !== 4) { uyar("girisUyari", "PIN 4 haneli olmalı."); return; }
      uyar("girisUyari", "Kontrol ediliyor...", true);
      postaci.publish(KONU_KOMUT, ["GIRIS", kimlik, girilen].join("|"));
      cevapBekle("giris", "girisUyari");
    }
    $("pinGiris").addEventListener("keydown", e => { if (e.key === "Enter") girisYap(); });

    function kapiyiAc() {
      uyar("kapiUyari", "", true);
      postaci.publish(KONU_KOMUT, ["AC", kimlik, pin, isim].join("|"));
      durumYaz("Komut gönderildi, kapı bekleniyor...", "#3b82f6");
      cevapBekle("ac", "kapiUyari");
      // kapi acilirsa ESP32 cevap degil DURUM yayinlar; zaman asimini o zaman iptal et
      const iptal = setInterval(() => { if ($("yazi").textContent === "Kapı açık") { clearTimeout(zamanAsimi); bekleyen = null; clearInterval(iptal); } }, 200);
      setTimeout(() => clearInterval(iptal), 9000);
    }

    function ayarlariAc() { $("isimAyar").value = isim; uyar("ayarUyari", "", true); goster("ayarKart"); }
    function geriDon() { kapiEkrani(); }
    function isimKaydet() {
      const yeni = $("isimAyar").value.trim();
      if (!yeni) { uyar("ayarUyari", "Ad boş olamaz."); return; }
      isim = yeni; sakla("isim", isim); $("merhaba").textContent = "Merhaba, " + isim;
      uyar("ayarUyari", "Ad kaydedildi.", true);
    }
    function pinDegistir() {
      const eski = $("eskiPin").value.trim(), yeni = $("yeniPin").value.trim(), yeni2 = $("yeniPin2").value.trim();
      if (!/^\d{4}$/.test(yeni)) { uyar("ayarUyari", "Yeni PIN 4 haneli bir sayı olmalı."); return; }
      if (yeni !== yeni2) { uyar("ayarUyari", "Yeni PIN'ler aynı değil."); return; }
      uyar("ayarUyari", "Gönderiliyor...", true);
      postaci.publish(KONU_KOMUT, ["PIN", kimlik, eski, yeni, isim].join("|"));
      cevapBekle("pin", "ayarUyari");
    }
    function cikisYap() {
      pin = null; sakla("pin", null);
      $("isimGiris").value = isim;
      goster("girisKart");
    }
    function kapiEkrani() {
      $("merhaba").textContent = "Merhaba, " + isim;
      goster("kapiKart", "kayitKart");
    }

    // Acilista: bu telefonda daha once giris yapildiysa dogrudan kapi ekranina gec
    $("isimGiris").value = isim;
    if (pin) kapiEkrani(); else goster("girisKart");
  </script>
</body>
</html>
